plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ledgerbook.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ledgerbook.lite'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.4.1'
    }

    signingConfigs {
        stableSideload {
            storeFile file('../signing/ledgerbook-lite.jks')
            storePassword 'ledgerbook123'
            keyAlias 'ledgerbook'
            keyPassword 'ledgerbook123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableSideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableSideload
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedV14Activity = file('src/main/java/com/ledgerbook/lite/LedgerV14Activity.java')

tasks.register('prepareV14', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_v14.py'
    inputs.file file('src/main/java/com/ledgerbook/lite/LedgerV13Activity.java')
    inputs.file rootProject.file('scripts/prepare_v14.py')
    outputs.file generatedV14Activity
}

tasks.register('prepareV15Database', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_v15_database.py'
    inputs.file file('src/main/java/com/ledgerbook/lite/LedgerDb.java')
    inputs.file file('src/main/java/com/ledgerbook/lite/LedgerV2Migration.java')
    inputs.file rootProject.file('scripts/prepare_v15_database.py')
}

tasks.register('prepareV15Settings', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_v15_settings.py'
    inputs.file file('src/main/java/com/ledgerbook/lite/SettingsPageView.java')
    inputs.file file('src/main/java/com/ledgerbook/lite/ModuleRepository.java')
    inputs.file file('src/main/java/com/ledgerbook/lite/ModuleCenterDialog.java')
    inputs.file rootProject.file('scripts/prepare_v15_settings.py')
}

tasks.register('prepareV15QuickEntry', Exec) {
    dependsOn tasks.named('prepareV14')
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/run_v15_quick_entry.py'
    inputs.file file('src/main/java/com/ledgerbook/lite/LedgerV13Activity.java')
    inputs.file file('src/main/java/com/ledgerbook/lite/QuickEntryRules.java')
    inputs.file rootProject.file('scripts/prepare_v14.py')
    inputs.file rootProject.file('scripts/prepare_v15_quick_entry.py')
    inputs.file rootProject.file('scripts/run_v15_quick_entry.py')
    outputs.file generatedV14Activity
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareV15QuickEntry')
    dependsOn tasks.named('prepareV15Database')
    dependsOn tasks.named('prepareV15Settings')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.0.0'
}
