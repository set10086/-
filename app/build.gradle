plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ledgerbook.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ledgerbook.lite'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        stableSideload {
            storeFile file('../signing/ledgerbook-lite.jks')
            storePassword 'ledgerbook123'
            keyAlias 'ledgerbook'
            keyPassword 'ledgerbook123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableSideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableSideload
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
