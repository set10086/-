name: Build LedgerBook Lite APK

on:
  push:
    branches:
      - ledgerbook-lite-apk
      - ledgerbook-lite-v1.1-cartoon
      - ledgerbook-lite-v1.2-inputs
      - ledgerbook-lite-v1.3-navigation
      - ledgerbook-lite-v1.4-crayon-settings
      - ledgerbook-lite-v1.4.1-settings-icons
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare stable signing key
        run: |
          base64 --decode signing/ledgerbook-lite.jks.b64 > signing/ledgerbook-lite.jks
          keytool -list -keystore signing/ledgerbook-lite.jks -storepass ledgerbook123 -alias ledgerbook >/dev/null

      - name: Generate V1.4 activity
        run: python3 scripts/prepare_v14.py

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LedgerBook-Lite-v1.4.1.apk
          sha256sum LedgerBook-Lite-v1.4.1.apk > LedgerBook-Lite-v1.4.1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerBook-Lite-V1.4.1-APK
          path: |
            LedgerBook-Lite-v1.4.1.apk
            LedgerBook-Lite-v1.4.1.sha256
          if-no-files-found: error
          retention-days: 30
