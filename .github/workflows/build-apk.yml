name: Build LedgerBook Lite APK

on:
  push:
    branches:
      - ledgerbook-lite-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LedgerBook-Lite-v1.0.0.apk
          sha256sum LedgerBook-Lite-v1.0.0.apk > LedgerBook-Lite-v1.0.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerBook-Lite-APK
          path: |
            LedgerBook-Lite-v1.0.0.apk
            LedgerBook-Lite-v1.0.0.sha256
          if-no-files-found: error
          retention-days: 30
