name: Build LedgerBook Lite APK

on:
  push:
    branches:
      - ledgerbook-lite-apk
      - ledgerbook-lite-v1.1-cartoon
      - ledgerbook-lite-v1.2-inputs
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare source and stable signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/ledgerbook/lite/LedgerV12Activity.java')
          text = path.read_text()
          old = '''        LedgerDb.Account[] target = {firstDifferent(accounts, source[0].id)};
          long[] occurredAt = {System.currentTimeMillis()};'''
          new = '''        LedgerDb.Account[] target = {firstDifferent(accounts, source[0].id)};
          TextView[] targetViewRef = {null};
          long[] occurredAt = {System.currentTimeMillis()};'''
          if old not in text:
              raise SystemExit('target state insertion point not found')
          text = text.replace(old, new, 1)
          old = '''                    if (target[0] != null && target[0].id == account.id) {
                        target[0] = firstDifferent(accounts, account.id);
                    }'''
          new = '''                    if (target[0] != null && target[0].id == account.id) {
                        target[0] = firstDifferent(accounts, account.id);
                        if (targetViewRef[0] != null) {
                            targetViewRef[0].setText(target[0] == null
                                    ? "请先创建另一个账户" : accountLabel(target[0]));
                        }
                    }'''
          if old not in text:
              raise SystemExit('target refresh block not found')
          text = text.replace(old, new, 1)
          old = '''        TextView targetView = selectField(target[0] == null ? "请先创建另一个账户" : accountLabel(target[0]),
                  "转入账户必须不同");'''
          new = '''        TextView targetView = selectField(target[0] == null ? "请先创建另一个账户" : accountLabel(target[0]),
                  "转入账户必须不同");
          targetViewRef[0] = targetView;'''
          if old not in text:
              raise SystemExit('target view assignment point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          base64 --decode signing/ledgerbook-lite.jks.b64 > signing/ledgerbook-lite.jks
          keytool -list -keystore signing/ledgerbook-lite.jks -storepass ledgerbook123 -alias ledgerbook >/dev/null

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LedgerBook-Lite-v1.2.0.apk
          sha256sum LedgerBook-Lite-v1.2.0.apk > LedgerBook-Lite-v1.2.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LedgerBook-Lite-V1.2-APK
          path: |
            LedgerBook-Lite-v1.2.0.apk
            LedgerBook-Lite-v1.2.0.sha256
          if-no-files-found: error
          retention-days: 30
